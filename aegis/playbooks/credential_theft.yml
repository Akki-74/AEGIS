name: Credential Theft Response Playbook
description: Automated containment and remediation recommendations following LSASS access or Kerberos ticket abuse.
version: 1.0.0
trigger_techniques:
  - T1003.001  # LSASS Memory
  - T1558.003  # Kerberoasting
  - T1558.004  # AS-REP Roasting
severity_threshold: high

steps:
  - id: 1
    action: isolate_endpoint
    description: Issue network isolation command to EDR agent on affected source host.
    automated: false
    tools: ["EDR API", "Windows Defender Firewall"]
    parameters:
      target: "{affected_hosts}"
      allow_mgmt: true

  - id: 2
    action: force_password_reset
    description: Force password change on next logon and invalidate current Kerberos TGT sessions for compromised identities.
    automated: false
    tools: ["Active Directory PowerShell", "Azure AD Graph"]
    parameters:
      accounts: "{affected_users}"

  - id: 3
    action: revoke_kerberos_tickets
    description: Purge cached Kerberos tickets via klist purge and reset service principal account passwords if Kerberoasted.
    automated: false
    tools: ["klist.exe", "Active Directory Users & Computers"]

  - id: 4
    action: audit_lsass_access
    description: Collect volatile memory dump of LSASS process memory handles and examine source binary hash on disk.
    automated: false
    tools: ["DumpIt", "WinPmem", "Velociraptor"]

  - id: 5
    action: check_golden_silver_tickets
    description: Inspect event logs for mismatched domain SIDs, abnormal PAC validation errors, or Event 4769 with encryption type 0x17.
    automated: false
    tools: ["Keroberus", "Splunk / OpenSearch query"]
