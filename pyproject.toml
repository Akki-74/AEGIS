[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS — Detection Engineering & Automated Incident Correlation platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "AEGIS Team" },
]
keywords = [
    "sigma",
    "detection-engineering",
    "siem",
    "correlation",
    "mitre-attack",
    "threat-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
dependencies = [
    "pysigma>=0.11.0",
    "pysigma-backend-elasticsearch>=1.1.0",
    "pandas>=2.1.0",
    "networkx>=3.2",
    "click>=8.1.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
    "rich>=13.6.0",
]

# ---------------------------------------------------------------------------
# Optional / development dependencies
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0.12",
]

# ---------------------------------------------------------------------------
# CLI entry point
# ---------------------------------------------------------------------------
[project.scripts]
aegis = "aegis.cli:main"

# ---------------------------------------------------------------------------
# Setuptools package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["aegis*"]

# ---------------------------------------------------------------------------
# Ruff — fast Python linter & formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["aegis", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # Line length handled by formatter
    "B008",   # Do not perform function calls in argument defaults
    "UP017",  # Use datetime.UTC alias (timezone.utc is standard across versions)
    "UP042",  # Class inherits from both str and enum.Enum (standard pattern)
    "W293",   # Blank line contains whitespace
    "B904",   # Raise from within except clause
    "B007",   # Loop control variable not used
    "F541",   # f-string without placeholders
]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
]

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sigma.*",
    "pandas.*",
    "networkx.*",
    "yaml.*",
    "rich.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "aegis.pipelines.*",
]
ignore_errors = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["aegis"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 40
