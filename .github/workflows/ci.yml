# =============================================================================
# AEGIS — GitHub Actions CI Pipeline
# =============================================================================
# Triggers on pushes and pull requests to the main branch.
# Runs linting, type checking, tests with coverage, and Sigma rule validation.
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same branch / PR to save resources.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check aegis/ tests/

      - name: Run ruff formatter check
        run: ruff format --check aegis/ tests/

      - name: Run mypy type checking
        run: mypy aegis/

  # ---------------------------------------------------------------------------
  # Tests with Coverage
  # ---------------------------------------------------------------------------
  test:
    name: "Tests (Python 3.11)"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=aegis \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Sigma Rule Validation
  # ---------------------------------------------------------------------------
  validate-rules:
    name: "Validate Sigma Rules"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate all Sigma rules have required metadata
        run: |
          # Check that Sigma rules exist before validation
          if [ -d "sigma_rules" ] && [ "$(find sigma_rules -name '*.yml' | head -1)" ]; then
            aegis rules validate --rules-dir sigma_rules/
          else
            echo "⚠️  No Sigma rules found in sigma_rules/ — skipping validation."
            echo "   Add .yml rule files to sigma_rules/ to enable this check."
          fi
